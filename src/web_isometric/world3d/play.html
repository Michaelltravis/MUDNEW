<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misthollow</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; overflow: hidden; }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8e2d4; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  /* cheap vignette: a CSS layer, not a post-processing pass */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #07080b;
    color: #cbbf9f; letter-spacing: .08em; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px;
    background: rgba(10,10,14,.62); border: 1px solid rgba(255,240,200,.14); border-radius: 6px;
    color: #d8cfb8; white-space: nowrap; pointer-events: none; transition: opacity 1s; }
  #room-name { position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    font: 600 17px/1 Georgia, "Times New Roman", serif; letter-spacing: .06em; color: #f1e6c8;
    text-shadow: 0 2px 8px #000; pointer-events: none; transition: opacity .5s; }
  #perf { position: fixed; right: 10px; top: 10px; min-width: 210px; padding: 8px 10px;
    background: rgba(8,9,12,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #d6e2d0; display: none; }
  #perf.on { display: block; }
  #perf button { margin-top: 6px; width: 100%; font: inherit; color: #111; background: #d8c48c;
    border: 0; border-radius: 4px; padding: 4px; cursor: pointer; }
  @media (max-width: 600px) { #hint { font-size: 11px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/v/{{V}}/vendor/three/three.module.min.js",
  "three/addons/": "/v/{{V}}/vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="room-name"></div>
<div id="hint">WASD or click to move · Space to attack · scroll to zoom · F3 performance</div>
<div id="perf"></div>
<div id="loading">MISTHOLLOW</div>
<script src="/platformer/roomgen.js?v={{V}}"></script>
<script>
  // roomgen.js needs two helpers that live in the Phaser client's sprites.js
  window.MH = window.MH || {};
  MH.mulberry32 = MH.mulberry32 || function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  MH.themeForSector = MH.themeForSector || (s => ['inside', 'city', 'dungeon', 'cave', 'forest', 'field', 'hills',
    'mountain', 'desert', 'swamp', 'water_swim', 'water_noswim', 'underwater', 'flying', 'default'].includes(s) ? s : 'default');
</script>
<script type="module" src="/v/{{V}}/world3d/spike.js"></script>
</body>
</html>
